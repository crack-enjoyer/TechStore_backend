version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@Asd1024"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure

  user-service:
    image: user-service:latest
    env_file:
      - ./user-service/.env
    depends_on:
      - db
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  goods-service:
    image: goods-service:latest
    env_file:
      - ./goods-service/.env
    depends_on:
      - db
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  api-gateway:
    image: api-gateway:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - api-gateway
    deploy:
      placement:
        constraints: [node.role == manager]

volumes:
  db-data:

networks:
  app-network:
    driver: overlay  # ← важно для Swarm!